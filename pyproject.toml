[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cedar-authorizer"
version = "0.1.0"
description = "Cedar policy authorization engine integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cedarpy>=0.4.0",
    "loguru",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cedar_authorizer*"]